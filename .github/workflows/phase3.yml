name: Phase 3 verification

on:
  pull_request:
  push:
    branches: [main, feat/react-vite-firebase]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Contract tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit generated lockfile once
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/react-vite-firebase' && hashFiles('package-lock.json') != ''
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Phase 3: lock frontend dependencies"
          git push origin HEAD:feat/react-vite-firebase
